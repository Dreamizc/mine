<!doctype html>
<!-- ไฟล์นี้สร้างอัตโนมัติจาก src/ ด้วย build.py — แก้ไขที่ src/ แล้วรัน python3 build.py -->
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ระบบจัดการร้านเดลิเวอรี่</title>
  <meta name="description" content="ระบบจัดการต้นทุน ราคาเมนู ออเดอร์ และกำไร/ขาดทุน สำหรับร้านอาหารเดลิเวอรี่">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
:root {
  color-scheme: light;
  --bg: #f6f5f2;
  --surface: #ffffff;
  --surface-2: #f0efec;
  --border: #e3e1dc;
  --text: #1b1a18;
  --text-2: #52514e;
  --muted: #8a8882;
  --primary: #e85d1f;
  --primary-ink: #ffffff;
  --primary-soft: #fdeee6;
  --good: #11804f;
  --good-soft: #e3f4ec;
  --bad: #c7362f;
  --bad-soft: #fbe7e6;
  --warn: #a86500;
  --warn-soft: #fff3dc;
  --series-1: #2a78d6;
  --series-2: #eb6834;
  --grid: #e9e7e2;
  --shadow: 0 1px 2px rgba(0,0,0,.04), 0 4px 16px rgba(0,0,0,.05);
  --radius: 14px;
  --font: 'Noto Sans Thai', 'Sarabun', 'Leelawadee UI', 'Tahoma', system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #121211;
    --surface: #1a1a19;
    --surface-2: #242422;
    --border: #33322f;
    --text: #f4f3ef;
    --text-2: #c3c2b7;
    --muted: #8f8d86;
    --primary: #f07338;
    --primary-ink: #1a0e07;
    --primary-soft: #3a2216;
    --good: #43c08a;
    --good-soft: #13291f;
    --bad: #f07a73;
    --bad-soft: #351816;
    --warn: #f0b44c;
    --warn-soft: #33270f;
    --series-1: #3987e5;
    --series-2: #d95926;
    --grid: #2c2b29;
    --shadow: 0 1px 2px rgba(0,0,0,.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #121211; --surface: #1a1a19; --surface-2: #242422; --border: #33322f;
  --text: #f4f3ef; --text-2: #c3c2b7; --muted: #8f8d86;
  --primary: #f07338; --primary-ink: #1a0e07; --primary-soft: #3a2216;
  --good: #43c08a; --good-soft: #13291f; --bad: #f07a73; --bad-soft: #351816;
  --warn: #f0b44c; --warn-soft: #33270f;
  --series-1: #3987e5; --series-2: #d95926; --grid: #2c2b29; --shadow: 0 1px 2px rgba(0,0,0,.3);
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  font-size: 15px;
  line-height: 1.55;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
h1, h2, h3, h4 { margin: 0; line-height: 1.3; }
.num { font-variant-numeric: tabular-nums; text-align: right; white-space: nowrap; }

/* ---------- Layout ---------- */
.app { display: flex; min-height: 100vh; }
.sidebar {
  width: 240px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border);
  position: sticky; top: 0; height: 100vh; padding: 18px 12px; display: flex; flex-direction: column; gap: 18px;
}
.brand { display: flex; gap: 10px; align-items: center; padding: 0 8px; }
.brand-logo { font-size: 28px; width: 44px; height: 44px; display: grid; place-items: center; background: var(--primary-soft); border-radius: 12px; }
.brand-name { font-weight: 700; font-size: 15px; }
.brand-sub { font-size: 12px; color: var(--muted); }
.nav { display: flex; flex-direction: column; gap: 2px; }
.nav a {
  display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 10px;
  color: var(--text-2); text-decoration: none; font-weight: 500; white-space: nowrap;
}
.nav a span { width: 22px; text-align: center; }
.nav a:hover { background: var(--surface-2); color: var(--text); }
.nav a.active { background: var(--primary-soft); color: var(--primary); font-weight: 600; }
.main { flex: 1; min-width: 0; padding: 24px 28px 64px; outline: none; }

@media (max-width: 860px) {
  .app { flex-direction: column; }
  .sidebar { width: 100%; height: auto; position: sticky; top: 0; z-index: 20; padding: 10px 0 0; gap: 8px; border-right: 0; border-bottom: 1px solid var(--border); }
  .brand { padding: 0 16px; }
  .brand-logo { width: 34px; height: 34px; font-size: 20px; }
  .nav { flex-direction: row; overflow-x: auto; padding: 0 10px 8px; scrollbar-width: none; }
  .nav::-webkit-scrollbar { display: none; }
  .nav a { padding: 8px 12px; font-size: 14px; }
  .main { padding: 16px 16px 64px; }
}

/* ---------- Sync status ---------- */
.sync-status { margin: 0 8px; padding: 6px 10px; border-radius: 9px; font-size: 12px; background: var(--surface-2); color: var(--text-2); display: flex; gap: 6px; align-items: center; min-width: 0; }
.sync-status span { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sync-status .dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; background: var(--good); }
.sync-status.offline .dot { background: var(--warn); }
@media (max-width: 860px) { .sync-status { margin: 0 16px; } }
.gate { max-width: 520px; margin: 6vh auto 0; }
.gate .card { display: flex; flex-direction: column; gap: 12px; }
.gate h2 { font-size: 20px; }
pre.code { background: var(--surface-2); border-radius: 10px; padding: 12px; font-size: 12px; overflow-x: auto; max-height: 260px; margin: 0; white-space: pre; }
.spinner { width: 28px; height: 28px; border: 3px solid var(--surface-2); border-top-color: var(--primary); border-radius: 50%; animation: spin .8s linear infinite; margin: 0 auto; }
@keyframes spin { to { transform: rotate(360deg); } }
@media (prefers-reduced-motion: reduce) { .spinner { animation-duration: 3s; } }

/* ---------- Page header ---------- */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; flex-wrap: wrap; margin-bottom: 18px; }
.page-head h1 { font-size: 24px; }
.page-head p { margin: 4px 0 0; color: var(--text-2); font-size: 14px; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

/* ---------- Cards & grids ---------- */
.card { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card h3 { font-size: 16px; margin-bottom: 12px; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h3 small { font-weight: 400; color: var(--muted); font-size: 13px; }
.grid { display: grid; gap: 16px; }
.grid + .grid, .card + .grid, .grid + .card, .card + .card { margin-top: 16px; }
.grid > .card { margin-top: 0; }
.g2 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.g3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.g4 { grid-template-columns: repeat(4, minmax(0, 1fr)); }
.g-21 { grid-template-columns: minmax(0, 2fr) minmax(0, 1fr); }
@media (max-width: 1100px) { .g4 { grid-template-columns: repeat(2, minmax(0, 1fr)); } .g-21 { grid-template-columns: 1fr; } }
@media (max-width: 760px) { .g2, .g3 { grid-template-columns: 1fr; } }
@media (max-width: 420px) { .g4 { grid-template-columns: 1fr 1fr; gap: 10px; } }

.section-title { font-size: 13px; font-weight: 600; color: var(--muted); text-transform: uppercase; letter-spacing: .03em; margin: 22px 0 10px; }

/* ---------- KPI tiles ---------- */
.kpi { padding: 14px 16px; }
.kpi .label { font-size: 13px; color: var(--text-2); }
.kpi .value { font-size: 24px; font-weight: 700; font-variant-numeric: tabular-nums; margin-top: 2px; }
.kpi .sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
@media (max-width: 420px) { .kpi .value { font-size: 19px; } }
.pos { color: var(--good); }
.neg { color: var(--bad); }

/* ---------- Buttons ---------- */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 8px 14px; border-radius: 10px; border: 1px solid var(--border); background: var(--surface);
  cursor: pointer; font-weight: 500; font-size: 14px; white-space: nowrap; min-height: 38px;
}
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.danger { color: var(--bad); }
.btn.danger:hover { background: var(--bad-soft); }
.btn.sm { padding: 4px 10px; min-height: 30px; font-size: 13px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn.lg { min-height: 48px; font-size: 16px; font-weight: 600; }
.btn:disabled { opacity: .5; cursor: not-allowed; }
.icon-btn { border: 0; background: transparent; cursor: pointer; width: 34px; height: 34px; border-radius: 8px; font-size: 16px; color: var(--text-2); }
.icon-btn:hover { background: var(--surface-2); color: var(--text); }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }

/* ---------- Forms ---------- */
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field > span, .field > label { font-size: 13px; color: var(--text-2); font-weight: 500; }
.field small { color: var(--muted); font-size: 12px; }
.input, select.input, textarea.input {
  width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 9px; background: var(--surface);
  min-height: 38px;
}
.input:focus { outline: 2px solid var(--primary); outline-offset: -1px; border-color: transparent; }
.input.num { text-align: right; }
.form-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; }
.form-grid .full { grid-column: 1 / -1; }
@media (max-width: 560px) { .form-grid { grid-template-columns: 1fr; } }
.check { display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 14px; }
.check input { width: 18px; height: 18px; accent-color: var(--primary); }
.inline { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; align-items: flex-end; margin-bottom: 16px; }
.filters .field { min-width: 140px; }

/* segmented / chips */
.seg { display: inline-flex; background: var(--surface-2); padding: 3px; border-radius: 10px; gap: 2px; flex-wrap: wrap; }
.seg button { border: 0; background: transparent; padding: 6px 12px; border-radius: 8px; cursor: pointer; font-size: 14px; color: var(--text-2); }
.seg button.on { background: var(--surface); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chip { border: 1px solid var(--border); background: var(--surface); padding: 7px 14px; border-radius: 999px; cursor: pointer; font-size: 14px; }
.chip.on { background: var(--primary); border-color: var(--primary); color: var(--primary-ink); font-weight: 600; }
.chip small { opacity: .8; font-size: 12px; }

/* ---------- Tables ---------- */
.table-wrap { overflow-x: auto; margin: 0 -4px; }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th, td { padding: 9px 8px; border-bottom: 1px solid var(--border); text-align: left; vertical-align: middle; }
th { font-size: 12px; font-weight: 600; color: var(--muted); white-space: nowrap; }
tbody tr:hover { background: var(--surface-2); }
tfoot td { font-weight: 700; border-top: 2px solid var(--border); border-bottom: 0; }
td.actions-cell { white-space: nowrap; text-align: right; }
.empty { text-align: center; color: var(--muted); padding: 28px 12px; }
.empty .big { font-size: 34px; display: block; margin-bottom: 6px; }

/* ---------- Badges ---------- */
.badge { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; background: var(--surface-2); color: var(--text-2); white-space: nowrap; font-weight: 500; }
.badge.good { background: var(--good-soft); color: var(--good); }
.badge.bad { background: var(--bad-soft); color: var(--bad); }
.badge.warn { background: var(--warn-soft); color: var(--warn); }
.badge.primary { background: var(--primary-soft); color: var(--primary); }

.alert { display: flex; gap: 10px; padding: 10px 12px; border-radius: 10px; font-size: 14px; align-items: flex-start; }
.alert + .alert { margin-top: 8px; }
.alert.warn { background: var(--warn-soft); color: var(--warn); }
.alert.bad { background: var(--bad-soft); color: var(--bad); }
.alert.good { background: var(--good-soft); color: var(--good); }
.alert.info { background: var(--surface-2); color: var(--text-2); }
.alert b { color: inherit; }

.muted { color: var(--muted); }
.small { font-size: 13px; }
.mt { margin-top: 12px; }
.hint { font-size: 13px; color: var(--text-2); background: var(--surface-2); border-radius: 10px; padding: 10px 12px; }

/* ---------- P&L statement ---------- */
.pl { width: 100%; }
.pl .row { display: flex; justify-content: space-between; gap: 12px; padding: 7px 0; border-bottom: 1px dashed var(--border); }
.pl .row.sub { padding-left: 16px; color: var(--text-2); font-size: 14px; }
.pl .row.total { font-weight: 700; border-bottom: 1px solid var(--border); }
.pl .row.grand { font-weight: 700; font-size: 18px; border-bottom: 0; border-top: 2px solid var(--text); margin-top: 4px; padding-top: 10px; }
.pl .row span:last-child { font-variant-numeric: tabular-nums; white-space: nowrap; }

/* ---------- Bar meter ---------- */
.meter { height: 8px; background: var(--surface-2); border-radius: 4px; overflow: hidden; min-width: 60px; }
.meter > i { display: block; height: 100%; background: var(--series-1); border-radius: 4px; }

/* ---------- Chart ---------- */
.chart { width: 100%; height: 260px; display: block; }
.chart .grid-line { stroke: var(--grid); stroke-width: 1; }
.chart .zero-line { stroke: var(--muted); stroke-width: 1; }
.chart text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .s1 { fill: var(--series-1); }
.chart .s2 { fill: var(--series-2); }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover { fill: var(--text); opacity: .05; }
.legend { display: flex; gap: 16px; font-size: 13px; color: var(--text-2); flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.tooltip {
  position: fixed; z-index: 100; pointer-events: none; background: var(--surface); border: 1px solid var(--border);
  box-shadow: 0 6px 24px rgba(0,0,0,.15); border-radius: 10px; padding: 8px 10px; font-size: 13px; min-width: 160px;
}
.tooltip .t-title { color: var(--muted); font-size: 12px; margin-bottom: 4px; }
.tooltip .t-row { display: flex; justify-content: space-between; gap: 14px; align-items: center; }
.tooltip .t-row b { font-variant-numeric: tabular-nums; }
.tooltip .t-key { display: inline-block; width: 12px; height: 2px; margin-right: 6px; vertical-align: middle; }

/* ---------- POS ---------- */
.pos-layout { display: grid; grid-template-columns: minmax(0, 1fr) 380px; gap: 16px; align-items: start; }
@media (max-width: 1100px) { .pos-layout { grid-template-columns: 1fr; } }
.menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
.menu-tile {
  text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 12px; padding: 12px;
  cursor: pointer; display: flex; flex-direction: column; gap: 4px; min-height: 86px; position: relative;
}
.menu-tile:hover { border-color: var(--primary); }
.menu-tile:active { transform: scale(.98); }
.menu-tile .mt-name { font-weight: 600; font-size: 14px; line-height: 1.35; }
.menu-tile .mt-price { color: var(--primary); font-weight: 700; margin-top: auto; }
.menu-tile .mt-qty { position: absolute; top: -6px; right: -6px; background: var(--primary); color: var(--primary-ink); border-radius: 999px; min-width: 24px; height: 24px; display: grid; place-items: center; font-size: 13px; font-weight: 700; padding: 0 6px; }
.cart { position: sticky; top: 16px; }
@media (max-width: 860px) { .cart { position: static; } }
.pos-mobile-bar { display: none; }
@media (max-width: 1100px) {
  .pos-mobile-bar {
    display: flex; justify-content: space-between; align-items: center; gap: 10px; position: fixed; left: 12px; right: 12px; bottom: 12px; z-index: 30;
    border: 0; border-radius: 14px; padding: 12px 16px; background: var(--primary); color: var(--primary-ink); font-size: 15px; cursor: pointer;
    box-shadow: 0 8px 24px rgba(0,0,0,.25);
  }
}
.cart-line { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 10px; padding: 10px 0; border-bottom: 1px solid var(--border); }
.cart-line .cl-name { font-weight: 600; font-size: 14px; }
.cart-line .cl-controls { display: flex; align-items: center; gap: 6px; grid-column: 1 / -1; justify-content: space-between; }
.qty { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 9px; overflow: hidden; }
.qty button { border: 0; background: var(--surface-2); width: 32px; height: 32px; cursor: pointer; font-size: 16px; }
.qty input { width: 44px; border: 0; text-align: center; height: 32px; background: var(--surface); }
.price-input { width: 86px; }
.sum-row { display: flex; justify-content: space-between; padding: 4px 0; font-size: 14px; }
.sum-row.big { font-size: 18px; font-weight: 700; padding-top: 8px; border-top: 1px solid var(--border); margin-top: 6px; }
.sum-row span:last-child { font-variant-numeric: tabular-nums; }

/* ---------- Menu cards ---------- */
.menu-card { display: flex; flex-direction: column; gap: 10px; }
.menu-card .mc-head { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
.menu-card .mc-name { font-size: 16px; font-weight: 700; }
.mini-table { font-size: 13px; }
.mini-table th, .mini-table td { padding: 5px 6px; }
.cost-bar { display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: var(--surface-2); gap: 2px; }
.cost-bar i { display: block; height: 100%; }
.row-editor { display: grid; grid-template-columns: minmax(0, 1fr) 110px 90px 34px; gap: 8px; align-items: center; margin-bottom: 8px; }
.row-editor .rc { font-size: 13px; text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }
@media (max-width: 560px) { .row-editor { grid-template-columns: minmax(0, 1fr) 90px 34px; } .row-editor .rc { display: none; } }

/* ---------- Modal ---------- */
.modal { border: 0; padding: 0; background: transparent; max-width: min(720px, calc(100vw - 24px)); width: 100%; max-height: calc(100vh - 24px); }
.modal.wide { max-width: min(980px, calc(100vw - 24px)); }
.modal::backdrop { background: rgba(10, 10, 10, .45); }
.modal-box { background: var(--surface); color: var(--text); border-radius: 16px; display: flex; flex-direction: column; max-height: calc(100vh - 24px); }
.modal-head { display: flex; justify-content: space-between; align-items: center; padding: 16px 18px; border-bottom: 1px solid var(--border); }
.modal-head h2 { font-size: 18px; }
.modal-body { padding: 18px; overflow-y: auto; }
.modal-foot { display: flex; justify-content: flex-end; gap: 8px; padding: 12px 18px; border-top: 1px solid var(--border); }

/* ---------- Toast ---------- */
.toasts { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); display: flex; flex-direction: column; gap: 8px; z-index: 200; width: max-content; max-width: calc(100vw - 32px); }
.toast { background: var(--text); color: var(--bg); padding: 10px 16px; border-radius: 10px; font-size: 14px; box-shadow: 0 6px 24px rgba(0,0,0,.2); animation: tin .2s ease-out; }
.toast.error { background: var(--bad); color: #fff; }
@keyframes tin { from { opacity: 0; transform: translateY(8px); } }

@media print {
  .sidebar, .actions, .filters, .btn { display: none !important; }
  .main { padding: 0; }
  .card { box-shadow: none; break-inside: avoid; }
}
@media (max-width: 1100px) { .toasts { bottom: 84px; } }

</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <div class="brand">
        <div class="brand-logo" aria-hidden="true">🍱</div>
        <div>
          <div class="brand-name" id="shopName">ร้านของฉัน</div>
          <div class="brand-sub">ระบบจัดการร้านเดลิเวอรี่</div>
        </div>
      </div>
      <div class="sync-status" id="syncStatus" hidden></div>
      <nav class="nav" id="nav">
        <a href="#dashboard" data-page="dashboard"><span>📊</span>ภาพรวม</a>
        <a href="#orders" data-page="orders"><span>🧾</span>รับออเดอร์</a>
        <a href="#menus" data-page="menus"><span>🍛</span>เมนู &amp; ต้นทุน</a>
        <a href="#ingredients" data-page="ingredients"><span>🥬</span>วัตถุดิบ &amp; สต็อก</a>
        <a href="#expenses" data-page="expenses"><span>💡</span>ค่าใช้จ่าย</a>
        <a href="#ads" data-page="ads"><span>📣</span>ค่าโฆษณา</a>
        <a href="#reports" data-page="reports"><span>📈</span>กำไร/ขาดทุน</a>
        <a href="#settings" data-page="settings"><span>⚙️</span>ตั้งค่า</a>

  <script>
'use strict';
/* =========================================================
 * core.js — ข้อมูล (Store) และสูตรคำนวณต้นทุน/กำไรทั้งหมด
 * ข้อมูลเก็บใน localStorage ของเบราว์เซอร์ (ไม่ต้องมีเซิร์ฟเวอร์)
 * ========================================================= */

/* ---------- Utilities ---------- */
const $ = (s, el = document) => el.querySelector(s);
const $$ = (s, el = document) => [...el.querySelectorAll(s)];
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const num = (v) => { const n = parseFloat(v); return Number.isFinite(n) ? n : 0; };
const round2 = (n) => Math.round((num(n) + Number.EPSILON) * 100) / 100;
const fmt = (n, d = 2) => (Number(n) || 0).toLocaleString('th-TH', { minimumFractionDigits: d, maximumFractionDigits: d });
const baht = (n) => (num(n) < -0.004 ? '-฿' : '฿') + fmt(Math.abs(num(n)));
const baht0 = (n) => (num(n) < -0.5 ? '-฿' : '฿') + fmt(Math.abs(num(n)), 0);
/** ราคาต่อหน่วยเล็ก (เช่น ต่อกรัม) แสดงทศนิยม 4 ตำแหน่งเมื่อต่ำกว่า 1 บาท */
const bahtU = (n) => (num(n) && Math.abs(num(n)) < 1 ? '฿' + fmt(n, 4) : baht(n));
const pct = (n) => fmt(n, 1) + '%';
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
const byId = (arr, id) => arr.find((x) => x.id === id);

const toISO = (d) => { const z = new Date(d.getTime() - d.getTimezoneOffset() * 60000); return z.toISOString().slice(0, 10); };
const today = () => toISO(new Date());
const nowTime = () => new Date().toTimeString().slice(0, 5);
const addDays = (iso, n) => { const d = new Date(iso + 'T00:00:00'); d.setDate(d.getDate() + n); return toISO(d); };
const monthStart = (iso) => iso.slice(0, 8) + '01';
const monthEnd = (iso) => { const d = new Date(iso.slice(0, 8) + '01T00:00:00'); d.setMonth(d.getMonth() + 1); d.setDate(0); return toISO(d); };
const daysBetween = (a, b) => Math.round((new Date(b + 'T00:00:00') - new Date(a + 'T00:00:00')) / 86400000) + 1;
const thDate = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short', year: '2-digit' });
const thDay = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('th-TH', { day: 'numeric', month: 'short' });
const thMonth = (iso) => new Date(iso + 'T00:00:00').toLocaleDateString('th-TH', { month: 'long', year: 'numeric' });

/* ---------- Store ---------- */
const DB_KEY = 'thai-delivery-rms-v1';
const VAT = 0.07;

function defaultData() {
  return {
    version: 1,
    settings: {
      shopName: 'ร้านของฉัน',
      dishesPerMonth: 1500, // จำนวนจานที่คาดว่าขายได้ต่อเดือน ใช้ปันส่วนค่าใช้จ่ายรายเดือนเข้าเมนู
      targetFoodCost: 35, // % ต้นทุนอาหารเป้าหมาย
      targetMargin: 20, // % กำไรเป้าหมายหลังหัก GP
    },
    channels: [
      { id: 'walkin', name: 'หน้าร้าน', gp: 0, vatOnGp: false, gpBeforeDiscount: false, active: true },
      { id: 'grab', name: 'GrabFood', gp: 30, vatOnGp: true, gpBeforeDiscount: true, active: true },
      { id: 'lineman', name: 'LINE MAN', gp: 30, vatOnGp: true, gpBeforeDiscount: true, active: true },
      { id: 'shopee', name: 'ShopeeFood', gp: 30, vatOnGp: true, gpBeforeDiscount: true, active: true },
      { id: 'robinhood', name: 'Robinhood', gp: 0, vatOnGp: false, gpBeforeDiscount: true, active: true },
    ],
    ingredients: [],
    preps: [], // ส่วนผสมทำเอง (สูตรย่อย) เช่น ซอสกะเพรา น้ำจิ้ม หมูหมัก
    productions: [], // บันทึกการทำส่วนผสม (ตัดวัตถุดิบ เพิ่มสต็อกส่วนผสม)
    purchases: [],
    expenses: [],
    menus: [],
    orders: [],
    ads: [],
  };
}

let DB;
const Store = {
  load() {
    let data = null;
    try { data = JSON.parse(localStorage.getItem(DB_KEY)); } catch (e) { data = null; }
    DB = Store.normalize(data);
  },
  normalize(data) {
    const def = defaultData();
    if (!data || typeof data !== 'object') return def;
    for (const k of Object.keys(def)) if (data[k] == null) data[k] = def[k];
    data.settings = { ...def.settings, ...data.settings };
    return data;
  },
  save() {
    // โหมดออนไลน์: ส่งเฉพาะส่วนที่เปลี่ยนขึ้น Firebase (Firestore มีแคชออฟไลน์ของตัวเอง)
    if (typeof Sync !== 'undefined' && Sync.cfg) { if (Sync.active) Sync.push(); return true; }
    try { localStorage.setItem(DB_KEY, JSON.stringify(DB)); return true; }
    catch (e) { if (typeof toast === 'function') toast('บันทึกไม่สำเร็จ: พื้นที่จัดเก็บของเบราว์เซอร์เต็ม', 'error'); return false; }
  },
  replace(data) { DB = Store.normalize(data); Store.save(); },
  reset() { DB = defaultData(); Store.save(); },
};

/* ---------- Cost calculations ---------- */

/** ต้นทุนต่อ 1 หน่วยใช้งาน (เช่น ต่อกรัม) หลังหัก % สูญเสีย (yield) */
function ingUnitCost(ing) {
  const usable = num(ing.packSize) * (num(ing.yield || 100) / 100);
  return usable > 0 ? num(ing.packPrice) / usable : 0;
}

/** ค่าใช้จ่ายต่อ 1 หน่วยที่ใส่ในเมนู: แบบต่อชิ้น = ราคาต่อชิ้น, แบบรายเดือน = ปันส่วนต่อจาน */
function expUnitCost(exp) {
  if (exp.type === 'monthly') {
    const d = num(DB.settings.dishesPerMonth);
    return d > 0 ? num(exp.amount) / d : 0;
  }
  return num(exp.amount);
}

/* ---------- ส่วนผสมทำเอง (สูตรย่อย) ---------- */
const PREP_MAX_DEPTH = 6; // กันวนซ้ำไม่รู้จบ กรณีสูตรอ้างถึงกันเอง
const prepById = (id) => byId(DB.preps || [], id);
/** วัตถุดิบ หรือ ส่วนผสมทำเอง ตาม id (ใช้ในสูตรเมนู/สูตรส่วนผสม) */
const stockItemById = (id) => byId(DB.ingredients, id) || prepById(id);

/** ต้นทุนต่อ 1 หน่วยของรายการในสูตร (วัตถุดิบ หรือ ส่วนผสมทำเอง) */
function itemUnitCost(id, depth = 0) {
  const i = byId(DB.ingredients, id);
  if (i) return ingUnitCost(i);
  const p = prepById(id);
  return p ? prepUnitCost(p, depth) : 0;
}
/** ต้นทุนการทำ 1 ครั้ง (1 สูตร) */
function prepBatchCost(p, depth = 0) {
  if (depth > PREP_MAX_DEPTH) return 0;
  return (p.items || []).reduce((s, r) => s + itemUnitCost(r.id, depth + 1) * num(r.qty), 0);
}
/** ต้นทุนต่อ 1 หน่วยของส่วนผสม = ต้นทุนทั้งสูตร ÷ ปริมาณที่ได้ */
function prepUnitCost(p, depth = 0) {
  const y = num(p.yieldQty);
  return y > 0 ? prepBatchCost(p, depth) / y : 0;
}
/** สูตร p ใช้ targetId อยู่ (ทั้งทางตรงและทางอ้อม) หรือไม่ */
function prepUses(p, targetId, depth = 0) {
  if (!p || depth > PREP_MAX_DEPTH) return false;
  return (p.items || []).some((r) => r.id === targetId || prepUses(prepById(r.id), targetId, depth + 1));
}
/**
 * แปลงสูตรเป็นรายการตัดสต็อก: วัตถุดิบตัดตรงๆ, ส่วนผสมที่ติดตามสต็อกตัดที่ตัวส่วนผสม,
 * ส่วนผสมที่ไม่ติดตามสต็อกแตกเป็นวัตถุดิบตามสัดส่วนที่ใช้
 */
function stockUsage(rows, mult = 1, depth = 0, out = []) {
  if (depth > PREP_MAX_DEPTH) return out;
  (rows || []).forEach((r) => {
    const q = num(r.qty) * mult;
    if (!q) return;
    if (byId(DB.ingredients, r.id)) { out.push({ id: r.id, qty: q }); return; }
    const p = prepById(r.id);
    if (!p) return;
    if (p.trackStock || !(num(p.yieldQty) > 0)) out.push({ id: p.id, qty: q });
    else stockUsage(p.items, q / num(p.yieldQty), depth + 1, out);
  });
  return out;
}
/** ตัด/คืนสต็อกตามรายการ usage (sign = 1 ตัด, -1 คืน) */
function applyUsage(usage, sign, mult = 1) {
  (usage || []).forEach((u) => {
    const i = stockItemById(u.id);
    if (i && i.trackStock) i.stock = Math.round((num(i.stock) - sign * num(u.qty) * mult) * 10000) / 10000;
  });
}

function fixedMonthlyTotal() {
  return DB.expenses.filter((e) => e.type === 'monthly').reduce((s, e) => s + num(e.amount), 0);
}
/** ค่าใช้จ่ายคงที่เฉลี่ยต่อวัน (รายเดือน × 12 ÷ 365) */
function dailyFixed() { return fixedMonthlyTotal() * 12 / 365; }

/** สรุปต้นทุนของเมนู */
function menuCost(m) {
  let ing = 0, unitExp = 0, overhead = 0;
  const lines = [];
  (m.ingredients || []).forEach((r) => {
    const i = stockItemById(r.id);
    if (!i) return;
    const isPrep = !byId(DB.ingredients, r.id);
    const c = itemUnitCost(r.id) * num(r.qty);
    ing += c;
    lines.push({ kind: isPrep ? 'prep' : 'ing', name: i.name, qty: num(r.qty), unit: i.unit, cost: c });
  });
  (m.expenses || []).forEach((r) => {
    const e = byId(DB.expenses, r.id);
    if (!e) return;
    const c = expUnitCost(e) * num(r.qty);
    if (e.type === 'monthly') overhead += c; else unitExp += c;
    lines.push({ kind: e.type === 'monthly' ? 'overhead' : 'exp', name: e.name, qty: num(r.qty), unit: e.type === 'monthly' ? 'จาน' : (e.unit || 'หน่วย'), cost: c });
  });
  return { ing, unitExp, overhead, variable: ing + unitExp, full: ing + unitExp + overhead, lines };
}

function channelById(id) { return byId(DB.channels, id) || { id, name: '(ช่องทางถูกลบ)', gp: 0, vatOnGp: false, gpBeforeDiscount: false }; }
/** อัตรา GP จริง (รวม VAT ถ้ามี) เป็นทศนิยม เช่น 0.321 */
function gpRateEff(ch) { return num(ch.gp) / 100 * (ch.vatOnGp ? 1 + VAT : 1); }
/** ราคาขายของเมนูในช่องทางนั้น (ถ้าไม่ได้ตั้งราคาเฉพาะช่องทาง ใช้ราคาหลัก) */
function menuPrice(m, chId) {
  const p = m.channelPrices ? num(m.channelPrices[chId]) : 0;
  return p > 0 ? p : num(m.price);
}

/** วิเคราะห์ราคาเมนูในแต่ละช่องทาง */
function menuChannelAnalysis(m, ch, cost) {
  cost = cost || menuCost(m);
  const price = menuPrice(m, ch.id);
  const gp = price * gpRateEff(ch);
  const net = price - gp;
  const profit = net - cost.variable;
  const profitFull = net - cost.full;
  // ราคาแนะนำ: ให้ (ราคา - GP - ต้นทุนรวม) = ราคา × กำไรเป้าหมาย
  const denom = 1 - gpRateEff(ch) - num(DB.settings.targetMargin) / 100;
  const suggested = denom > 0 ? cost.full / denom : 0;
  return {
    price, gp, net, profit, profitFull, suggested,
    foodCostPct: price > 0 ? cost.variable / price * 100 : 0,
    marginPct: price > 0 ? profitFull / price * 100 : 0,
  };
}

/** คำนวณตัวเลขทั้งหมดของ 1 ออเดอร์ (ใช้ค่าที่ snapshot ไว้ตอนบันทึก) */
function orderCalc(o) {
  const subtotal = o.items.reduce((s, it) => s + num(it.price) * num(it.qty), 0);
  const qty = o.items.reduce((s, it) => s + num(it.qty), 0);
  let disc = o.discountType === 'pct' ? subtotal * num(o.discountValue) / 100 : num(o.discountValue);
  disc = Math.min(Math.max(disc, 0), subtotal);
  const shopDisc = o.discountBy === 'platform' ? 0 : disc;
  const platDisc = disc - shopDisc;
  const gpBase = o.gpBeforeDiscount ? subtotal : subtotal - shopDisc;
  const gp = gpBase * num(o.gp) / 100 * (o.vatOnGp ? 1 + VAT : 1);
  const netRevenue = subtotal - shopDisc - gp;
  const varCost = o.items.reduce((s, it) => s + num(it.varCost) * num(it.qty), 0);
  const extra = num(o.extraCost);
  const profit = netRevenue - varCost - extra;
  return { subtotal, qty, disc, shopDisc, platDisc, customerPays: subtotal - disc, gpBase, gp, netRevenue, varCost, extra, profit };
}

/** สร้าง snapshot ของรายการในออเดอร์ (ราคา ต้นทุน วัตถุดิบที่ใช้) */
function snapshotItem(menuId, qty, price) {
  const m = byId(DB.menus, menuId);
  const c = m ? menuCost(m) : { variable: 0, full: 0 };
  return {
    menuId, name: m ? m.name : '(เมนูถูกลบ)', qty: num(qty), price: num(price),
    varCost: round2(c.variable), fullCost: round2(c.full),
    usage: m ? stockUsage(m.ingredients) : [],
  };
}

/** ตัด/คืนสต็อกวัตถุดิบตามออเดอร์ (sign = 1 ตัด, -1 คืน) */
function applyStock(order, sign) {
  order.items.forEach((it) => applyUsage(it.usage, sign, num(it.qty)));
}

/** รวมข้อมูลรายงานช่วงวันที่ from..to */
function aggregate(from, to, { includeFixed = true } = {}) {
  const blank = () => ({ orders: 0, qty: 0, subtotal: 0, disc: 0, shopDisc: 0, platDisc: 0, gp: 0, netRevenue: 0, varCost: 0, extra: 0, profit: 0, ads: 0 });
  const add = (t, c) => { for (const k of ['qty', 'subtotal', 'disc', 'shopDisc', 'platDisc', 'gp', 'netRevenue', 'varCost', 'extra', 'profit']) t[k] += c[k]; t.orders += 1; };
  const nDays = Math.max(0, daysBetween(from, to));
  const fixedPerDay = includeFixed ? dailyFixed() : 0;

  const days = {};
  for (let i = 0; i < Math.min(nDays, 1000); i++) { const d = addDays(from, i); days[d] = { date: d, ...blank() }; }
  const channels = {};
  const menus = {};
  const total = blank();

  DB.orders.forEach((o) => {
    if (o.date < from || o.date > to) return;
    const c = orderCalc(o);
    add(total, c);
    if (days[o.date]) add(days[o.date], c);
    channels[o.channelId] = channels[o.channelId] || blank();
    add(channels[o.channelId], c);
    // แบ่ง GP/ส่วนลดเข้าแต่ละเมนูตามสัดส่วนยอดขาย
    o.items.forEach((it) => {
      const sales = num(it.price) * num(it.qty);
      const share = c.subtotal > 0 ? sales / c.subtotal : 0;
      const key = it.menuId;
      const m = menus[key] = menus[key] || { menuId: key, name: (byId(DB.menus, key) || it).name, qty: 0, sales: 0, net: 0, varCost: 0, contribution: 0 };
      m.qty += num(it.qty);
      m.sales += sales;
      m.net += c.netRevenue * share;
      m.varCost += num(it.varCost) * num(it.qty);
      m.contribution = m.net - m.varCost;
    });
  });

  DB.ads.forEach((a) => {
    if (a.date < from || a.date > to) return;
    total.ads += num(a.amount);
    if (days[a.date]) days[a.date].ads += num(a.amount);
    channels[a.channelId] = channels[a.channelId] || blank();
    channels[a.channelId].ads += num(a.amount);
  });

  Object.values(days).forEach((d) => { d.fixed = fixedPerDay; d.net = d.profit - d.ads - d.fixed; });
  Object.values(channels).forEach((c) => { c.net = c.profit - c.ads; });
  total.fixed = fixedPerDay * nDays;
  total.net = total.profit - total.ads - total.fixed;
  total.nDays = nDays;

  return {
    total,
    days: Object.values(days),
    channels: Object.entries(channels).map(([id, v]) => ({ id, name: channelById(id).name, ...v })).sort((a, b) => b.subtotal - a.subtotal),
    menus: Object.values(menus).sort((a, b) => b.qty - a.qty),
  };
}

/** จุดคุ้มทุน: ต้องขายกี่ออเดอร์/วันถึงจะไม่ขาดทุน (อิงกำไรต่อออเดอร์เฉลี่ยหลังหักโฆษณา) */
function breakEven(agg) {
  const t = agg.total;
  if (!t.orders) return null;
  const perOrder = (t.profit - t.ads) / t.orders;
  const fixed = dailyFixed();
  return { perOrder, fixed, ordersPerDay: perOrder > 0 ? fixed / perOrder : Infinity, actualPerDay: t.orders / Math.max(1, t.nDays) };
}

/** สร้างไฟล์ CSV (มี BOM เพื่อให้ Excel อ่านภาษาไทยได้) */
function downloadFile(name, content, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = name;
  document.body.appendChild(a);
  a.click();
  setTimeout(() => { URL.revokeObjectURL(a.href); a.remove(); }, 500);
}
function toCSV(rows) {
  const cell = (v) => { let s = String(v ?? ''); if (typeof v === 'string' && /^[=+\-@]/.test(s)) s = "'" + s; return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; };
  return '﻿' + rows.map((r) => r.map(cell).join(',')).join('\n');
}

'use strict';

'use strict';
/* =========================================================
 * sync.js — ใช้งานหลายเครื่องผ่าน Firebase (Firestore + Authentication)
 * - ไม่ได้ตั้งค่า Firebase = ใช้ในเครื่องเดียว (localStorage) เหมือนเดิม
 * - ตั้งค่าแล้ว = ทุกเครื่องที่ล็อกอินเห็นข้อมูลชุดเดียวกันแบบเรียลไทม์
 *   และยังบันทึกได้ตอนเน็ตหลุด (ซิงก์ให้เองเมื่อกลับมาออนไลน์)
 * โครงสร้างบน Firestore:
 *   config/main            { settings, channels, ownerEmail }
 *   ingredients|purchases|expenses|menus|orders|ads/{id}   1 รายการ = 1 เอกสาร
 *   members/{email}        อีเมลพนักงานที่เจ้าของร้านอนุญาต
 * ========================================================= */

const FB_VERSION = '10.14.1';
const CFG_KEY = 'rms-firebase-config';
const DAYS_KEY = 'rms-cloud-days';

const Sync = {
  COLS: ['ingredients', 'preps', 'productions', 'purchases', 'expenses', 'menus', 'orders', 'ads'],
  WINDOWED: ['orders', 'ads', 'purchases', 'productions'], // โหลดเฉพาะช่วงวันล่าสุด เพื่อประหยัดโควตาการอ่าน
  cfg: null,
  state: 'off', // off | loading | login | verify | connecting | onboard | denied | error | ready
  error: '',
  user: null,
  auth: null,
  fs: null,
  config: undefined, // เอกสาร config/main (null = ยังไม่มีบนคลาวด์)
  cloud: {}, // col -> Map(id -> JSON) สถานะล่าสุดที่รู้ว่าอยู่บนคลาวด์ ใช้หาความต่างตอนบันทึก
  members: [],
  unsubs: [],
  pending: [],
  seen: new Set(),
  localCopy: null,
  online: navigator.onLine,

  get active() { return this.state === 'ready'; },
  get email() { return (this.user && this.user.email || '').toLowerCase(); },
  get ownerEmail() { return (this.config && this.config.ownerEmail || '').toLowerCase(); },
  get isOwner() { return !!this.email && this.email === this.ownerEmail; },
  days() { let d = 0; try { d = num(localStorage.getItem(DAYS_KEY)); } catch (e) { /* ignore */ } return d > 0 ? d : 90; },
  cutoff() { return addDays(today(), -this.days()); },

  /* ---------- ค่าตั้งค่า Firebase ---------- */
  /** รับได้ทั้ง JSON และโค้ด `const firebaseConfig = {...}` ที่คัดลอกจาก Firebase Console */
  parseConfig(text) {
    const cfg = {};
    const re = /["']?(\w+)["']?\s*:\s*["']([^"']+)["']/g;
    let m;
    while ((m = re.exec(String(text || '')))) cfg[m[1]] = m[2].trim();
    if (!cfg.apiKey || !cfg.projectId || !cfg.authDomain) return null;
    const keep = ['apiKey', 'authDomain', 'projectId', 'storageBucket', 'messagingSenderId', 'appId'];
    return Object.fromEntries(keep.filter((k) => cfg[k]).map((k) => [k, cfg[k]]));
  },
  loadCfg() {
    // ลิงก์เชื่อมต่อจากเครื่องอื่น: ...index.html#connect=xxxx
    const h = location.hash;
    if (h.startsWith('#connect=')) {
      try {
        const cfg = JSON.parse(decodeURIComponent(escape(atob(h.slice(9).replace(/-/g, '+').replace(/_/g, '/')))));
        if (cfg && cfg.apiKey && cfg.projectId) localStorage.setItem(CFG_KEY, JSON.stringify(cfg));
      } catch (e) { /* ลิงก์ไม่ถูกต้อง */ }
      history.replaceState(null, '', location.pathname + location.search + '#settings');
    }
    try { this.cfg = JSON.parse(localStorage.getItem(CFG_KEY)) || null; } catch (e) { this.cfg = null; }
    return this.cfg;
  },
  saveCfg(cfg) { localStorage.setItem(CFG_KEY, JSON.stringify(cfg)); this.cfg = cfg; },
  connectLink() {
    const b64 = btoa(unescape(encodeURIComponent(JSON.stringify(this.cfg)))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
    return location.href.split('#')[0] + '#connect=' + b64;
  },

  /* ---------- เริ่มต้น ---------- */
  loadScript(src) {
    return new Promise((res, rej) => {
      const s = document.createElement('script');
      s.src = src; s.onload = res; s.onerror = () => rej(new Error('โหลดไม่สำเร็จ: ' + src));
      document.head.appendChild(s);
    });
  },
  async start() {
    if (!this.cfg) { this.state = 'off'; return; }
    this.state = 'loading';
    render();
    try {
      if (!window.firebase) {
        const base = `https://www.gstatic.com/firebasejs/${FB_VERSION}/`;
        await this.loadScript(base + 'firebase-app-compat.js');
        await Promise.all([this.loadScript(base + 'firebase-auth-compat.js'), this.loadScript(base + 'firebase-firestore-compat.js')]);
      }
      const app = firebase.apps.length ? firebase.app() : firebase.initializeApp(this.cfg);
      this.auth = app.auth();
      this.fs = app.firestore();
      this.fs.enablePersistence({ synchronizeTabs: true }).catch(() => { /* เบราว์เซอร์ไม่รองรับแคชออฟไลน์ ใช้งานต่อได้ */ });
    } catch (e) {
      this.fail('เชื่อมต่อ Firebase ไม่ได้ ตรวจสอบอินเทอร์เน็ต หรือค่าตั้งค่า Firebase (' + e.message + ')');
      return;
    }
    this.auth.onAuthStateChanged((u) => {
      this.user = u;
      this.unsubAll();
      if (!u) this.state = 'login';
      else if (!u.emailVerified) this.state = 'verify';
      else { this.subscribe(); return; }
      render();
    });
  },
  fail(msg) { this.state = 'error'; this.error = msg; this.unsubAll(); render(); },
  unsubAll() { this.unsubs.forEach((u) => { try { u(); } catch (e) { /* ignore */ } }); this.unsubs = []; },

  /* ---------- ฟังการเปลี่ยนแปลงแบบเรียลไทม์ ---------- */
  subscribe() {
    this.unsubAll();
    if (!this.localCopy) this.localCopy = JSON.parse(JSON.stringify(DB));
    this.state = 'connecting';
    this.seen = new Set();
    this.pending = [];
    this.cloud = {};
    render();
    const onErr = (e) => {
      if (e && e.code === 'permission-denied') { this.state = 'denied'; this.unsubAll(); render(); }
      else this.fail('อ่านข้อมูลออนไลน์ไม่สำเร็จ: ' + (e && e.message || e));
    };
    this.COLS.forEach((col) => {
      let q = this.fs.collection(col);
      if (this.WINDOWED.includes(col)) q = q.where('date', '>=', this.cutoff());
      this.unsubs.push(q.onSnapshot((snap) => this.receive(col, snap.docs.map((d) => d.data())), onErr));
    });
    this.unsubs.push(this.fs.doc('config/main').onSnapshot((d) => this.receive('config', d.exists ? d.data() : null), onErr));
    this.unsubs.push(this.fs.collection('members').onSnapshot((s) => { this.members = s.docs.map((d) => d.id).sort(); scheduleRender(); }, () => {}));
  },
  receive(key, data) {
    // ระหว่างเปิดหน้าต่างแก้ไขอยู่ เก็บไว้ก่อน แล้วค่อยนำมาใช้ตอนปิดหน้าต่าง
    if (this.state === 'ready' && $('#modal').open) { this.pending.push([key, data]); return; }
    this.apply(key, data);
  },
  flush() {
    const p = this.pending; this.pending = [];
    p.forEach(([k, d]) => this.apply(k, d));
  },
  apply(key, data) {
    if (key === 'config') {
      this.config = data;
      this.cloud.config = data ? JSON.stringify(data) : null;
      if (data) {
        const def = defaultData();
        DB.settings = { ...def.settings, ...(data.settings || {}) };
        DB.channels = Array.isArray(data.channels) && data.channels.length ? data.channels : def.channels;
      }
    } else {
      this.cloud[key] = new Map(data.map((r) => [r.id, JSON.stringify(r)]));
      DB[key] = data;
    }
    if (this.state === 'connecting') {
      this.seen.add(key);
      if (this.seen.size === this.COLS.length + 1) { this.state = this.config ? 'ready' : 'onboard'; render(); }
    } else scheduleRender();
  },

  /** ฐานข้อมูลออนไลน์ยังว่าง: เลือกอัปโหลดข้อมูลในเครื่อง / ข้อมูลตัวอย่าง / เริ่มใหม่ */
  initCloud(source) {
    const base = source === 'local' ? this.localCopy : source === 'demo' ? buildDemoData() : defaultData();
    DB = Store.normalize(JSON.parse(JSON.stringify(base)));
    this.config = { ownerEmail: this.email };
    this.cloud = { config: null };
    this.state = 'ready';
    this.push();
  },

  /* ---------- บันทึกเฉพาะส่วนที่เปลี่ยน ---------- */
  push() {
    if (!this.active) return;
    const strip = (o) => JSON.parse(JSON.stringify(o));
    const cfg = strip({ settings: DB.settings, channels: DB.channels, ownerEmail: this.ownerEmail || this.email });
    const cfgJson = JSON.stringify(cfg);
    if (cfgJson !== this.cloud.config) {
      // แยก batch ของ config เพราะพนักงานไม่มีสิทธิ์แก้ จะได้ไม่ทำให้ออเดอร์บันทึกไม่ได้ไปด้วย
      this.cloud.config = cfgJson;
      this.config = cfg;
      this.fs.doc('config/main').set(cfg).catch((e) => this.writeError(e, 'การตั้งค่าร้าน'));
    }
    const ops = [];
    this.COLS.forEach((col) => {
      const prev = this.cloud[col] || (this.cloud[col] = new Map());
      const ids = new Set();
      DB[col].forEach((r) => {
        if (!r || !r.id) return;
        ids.add(r.id);
        const json = JSON.stringify(r);
        const old = prev.get(r.id);
        if (json === old) return;
        const ref = this.fs.collection(col).doc(r.id);
        if ((col === 'ingredients' || col === 'preps') && old) {
          // สต็อกใช้การบวก/ลบแบบสะสม เพื่อไม่ให้หลายเครื่องตัดสต็อกพร้อมกันแล้วทับกัน
          const { stock, ...rest } = strip(r);
          const delta = round2(num(stock) - num(JSON.parse(old).stock));
          const data = delta ? { ...rest, stock: firebase.firestore.FieldValue.increment(delta) } : rest;
          ops.push((b) => b.set(ref, data, { merge: true }));
        } else {
          const data = strip(r);
          ops.push((b) => b.set(ref, data));
        }
        prev.set(r.id, json);
      });
      [...prev.keys()].forEach((id) => {
        if (ids.has(id)) return;
        const ref = this.fs.collection(col).doc(id);
        ops.push((b) => b.delete(ref));
        prev.delete(id);
      });
    });
    for (let i = 0; i < ops.length; i += 450) {
      const b = this.fs.batch();
      ops.slice(i, i + 450).forEach((op) => op(b));
      b.commit().catch((e) => this.writeError(e));
    }
  },
  writeError(e, what) {
    const denied = e && e.code === 'permission-denied';
    toast(denied ? `บัญชีนี้ไม่มีสิทธิ์แก้ไข${what || 'ข้อมูลนี้'} (เฉพาะเจ้าของร้าน)` : 'บันทึกขึ้นออนไลน์ไม่สำเร็จ: ' + (e && e.message || e), 'error');
    // โหลดข้อมูลจริงจากคลาวด์ใหม่ เพื่อให้หน้าจอตรงกับที่บันทึกได้จริง
    if (this.active) this.subscribe();
  },

  /* ---------- บัญชีผู้ใช้ ---------- */
  login(email, pw) { return this.auth.signInWithEmailAndPassword(email.trim(), pw); },
  async signup(email, pw) {
    const cred = await this.auth.createUserWithEmailAndPassword(email.trim(), pw);
    await cred.user.sendEmailVerification();
  },
  resend() { return this.user.sendEmailVerification(); },
  resetPassword(email) { return this.auth.sendPasswordResetEmail(email.trim()); },
  async checkVerified() {
    await this.user.reload();
    this.user = this.auth.currentUser;
    if (!this.user.emailVerified) return false;
    await this.user.getIdToken(true);
    this.subscribe();
    return true;
  },
  logout() { this.unsubAll(); this.localCopy = null; return this.auth.signOut(); },
  disconnect() {
    this.unsubAll();
    if (this.auth) this.auth.signOut().catch(() => {});
    try { localStorage.removeItem(CFG_KEY); } catch (e) { /* ignore */ }
    this.cfg = null; this.state = 'off'; this.user = null; this.config = undefined;
    Store.save(); // เก็บข้อมูลล่าสุดไว้ในเครื่องนี้
  },

  /* ---------- สมาชิก (พนักงาน) ---------- */
  addMember(email) { return this.fs.collection('members').doc(email.trim().toLowerCase()).set({ email: email.trim().toLowerCase(), addedBy: this.email, addedAt: Date.now() }); },
  removeMember(email) { return this.fs.collection('members').doc(email).delete(); },

  /** กฎความปลอดภัยของ Firestore: เจ้าของร้าน + อีเมลที่อยู่ใน members เท่านั้น */
  rules(owner) {
    return `rules_version = '2';
service cloud.firestore {
  match /databases/{database}/documents {
    function signedIn() {
      return request.auth != null && request.auth.token.email_verified == true;
    }
    function isOwner() {
      return signedIn() && request.auth.token.email.lower() == '${String(owner || 'อีเมลเจ้าของร้าน').toLowerCase()}';
    }
    function isMember() {
      return isOwner() || (signedIn() && exists(/databases/$(database)/documents/members/$(request.auth.token.email.lower())));
    }
    match /members/{email} {
      allow read: if isMember();
      allow write: if isOwner();
    }
    match /config/{id} {
      allow read: if isMember();
      allow write: if isOwner();
    }
    match /{col}/{id} {
      allow read, write: if isMember() && col != 'members' && col != 'config';
    }
  }
}`;
  },
};

/* ---------- Tooltip (ใช้ textContent เพื่อความปลอดภัย) ---------- */
const tip = $('#tooltip');
function showTip(e, title, rows) {
  tip.replaceChildren();
  const t = document.createElement('div'); t.className = 't-title'; t.textContent = title; tip.appendChild(t);
  rows.forEach(([label, value, color]) => {
    const r = document.createElement('div'); r.className = 't-row';
    const l = document.createElement('span');
    if (color) { const k = document.createElement('i'); k.className = 't-key'; k.style.background = color; l.appendChild(k); }
    l.appendChild(document.createTextNode(label));
    const v = document.createElement('b'); v.textContent = value;
    if (value.startsWith('-')) v.className = 'neg';
    r.append(l, v); tip.appendChild(r);
  });
  tip.hidden = false;
  const pad = 14, w = tip.offsetWidth, h = tip.offsetHeight;
  let x = e.clientX + pad, y = e.clientY + pad;
  if (x + w > innerWidth - 8) x = e.clientX - w - pad;
  if (y + h > innerHeight - 8) y = e.clientY - h - pad;
  tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
}
const hideTip = () => { tip.hidden = true; };

/* ---------- Chart: ยอดขาย vs กำไรสุทธิรายวัน ---------- */
const ChartData = {};
function chartSlot(id, days) { ChartData[id] = days; return `<div class="chart-slot" data-chart="${id}"></div>`; }
function drawCharts() {
  $$('.chart-slot', main).forEach((slot) => { slot.innerHTML = barChartSVG(ChartData[slot.dataset.chart], slot.clientWidth || 600); });
}
function barChartSVG(days, W) {
  const H = 260, padL = 52, padR = 8, padT = 12, padB = 28;
  if (!days || !days.length) return '';
  const vals = days.flatMap((d) => [d.subtotal, d.net]);
  let max = Math.max(0, ...vals), min = Math.min(0, ...vals);
  if (max === min) max = min + 100;
  const step = niceStep((max - min) / 4);
  max = Math.ceil(max / step) * step; min = Math.floor(min / step) * step;
  const y = (v) => padT + (max - v) / (max - min) * (H - padT - padB);
  const plotW = W - padL - padR;
  const band = plotW / days.length;
  const gap = 2;
  const bw = Math.max(2, Math.min(18, (band - 6) / 2 - gap / 2));
  let s = `<svg class="chart" viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="กราฟยอดขายและกำไรสุทธิรายวัน">`;
  for (let v = min; v <= max + 1e-9; v += step) {
    s += `<line class="${Math.abs(v) < 1e-9 ? 'zero-line' : 'grid-line'}" x1="${padL}" x2="${W - padR}" y1="${y(v)}" y2="${y(v)}"/>`;
    s += `<text x="${padL - 6}" y="${y(v) + 4}" text-anchor="end">${fmt(v, 0)}</text>`;
  }
  const labelEvery = Math.max(1, Math.ceil(days.length / Math.max(1, Math.floor(plotW / 54))));
  const bar = (x, v, cls) => {
    const y0 = y(0), y1 = y(v), h = Math.abs(y0 - y1);
    if (h < 0.5) return '';
    const top = Math.min(y0, y1), r = Math.min(4, bw / 2, h);
    // มุมโค้งเฉพาะปลายแท่ง (ฝั่งที่ห่างจากเส้นฐาน)
    const path = v >= 0
      ? `M${x},${top + h} V${top + r} Q${x},${top} ${x + r},${top} H${x + bw - r} Q${x + bw},${top} ${x + bw},${top + r} V${top + h} Z`
      : `M${x},${top} V${top + h - r} Q${x},${top + h} ${x + r},${top + h} H${x + bw - r} Q${x + bw},${top + h} ${x + bw},${top + h - r} V${top} Z`;
    return `<path class="bar ${cls}" d="${path}"/>`;
  };
  days.forEach((d, i) => {
    const cx = padL + band * i + band / 2;
    s += bar(cx - bw - gap / 2, d.subtotal, 's1');
    s += bar(cx + gap / 2, d.net, 's2');
    if (i % labelEvery === 0) s += `<text x="${cx}" y="${H - 8}" text-anchor="middle">${esc(thDay(d.date))}</text>`;
  });
  // พื้นที่รับเมาส์ทั้งคอลัมน์ (วางทับแท่ง เพื่อให้ชี้ตรงไหนของวันก็เห็น tooltip)
  days.forEach((d, i) => { s += `<rect class="hit" data-i="${i}" x="${padL + band * i}" y="${padT}" width="${band}" height="${H - padT - padB}"/>`; });
  s += '</svg>';
  return s;
}
function niceStep(raw) {
  if (raw <= 0) return 1;
  const p = Math.pow(10, Math.floor(Math.log10(raw)));
  const f = raw / p;
  return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 5 ? 5 : 10) * p;
}
const chartLegend = () => `<div class="legend"><span><i style="background:var(--series-1)"></i>ยอดขาย</span><span><i style="background:var(--series-2)"></i>กำไรสุทธิ (หลังหักทุกอย่าง)</span></div>`;
